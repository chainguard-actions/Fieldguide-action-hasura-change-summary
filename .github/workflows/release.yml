name: release
on:
  release:
    types: [published, edited]
permissions:
  contents: write
jobs:
  git:
    runs-on: ubuntu-latest
    steps:
      - uses: Actions-R-Us/actions-tagger@330ddfac760021349fef7ff62b372f2f691c20fb # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          publish_latest_tag: true
