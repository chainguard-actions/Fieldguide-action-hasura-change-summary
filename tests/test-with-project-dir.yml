name: Test with custom project_dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Hasura project directory
        run: |
          mkdir -p hasura-project/metadata
          cat > hasura-project/config.yaml <<'EOF'
          version: 3
          endpoint: http://localhost:8080
          metadata_directory: metadata
          EOF
          cat > hasura-project/metadata/version.yaml <<'EOF'
          version: 3
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          project_dir: hasura-project
      - name: Assert action ran with custom project_dir
        env:
          CHANGE_HTML: ${{ steps.action.outputs.change_html }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "change_html: $CHANGE_HTML"
          # The action may fail due to no real GitHub API access, but it should
          # at least attempt to run with the provided project_dir.
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded with custom project_dir"
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action failed gracefully (expected with fake token/no real PR)"
            echo "PASS"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
