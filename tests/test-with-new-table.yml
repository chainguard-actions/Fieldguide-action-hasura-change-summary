name: Test with new table added
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a Hasura v3 metadata directory with a table.
      # Since GITHUB_BASE_REF is empty, GitHubLoader falls back to empty metadata.
      # The workspace has a "users" table, so there should be a "table added" change.
      - name: Set up Hasura metadata (v3, with users table)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/metadata/databases/default/tables"
          echo "version: 3" > "$GITHUB_WORKSPACE/metadata/version.yaml"
          cat > "$GITHUB_WORKSPACE/metadata/databases/databases.yaml" <<'EOF'
          - name: default
            kind: postgres
            tables: "!include default/tables/tables.yaml"
          EOF
          cat > "$GITHUB_WORKSPACE/metadata/databases/default/tables/tables.yaml" <<'EOF'
          - "!include public_users.yaml"
          EOF
          cat > "$GITHUB_WORKSPACE/metadata/databases/default/tables/public_users.yaml" <<'EOF'
          table:
            name: users
            schema: public
          EOF

      - id: action
        uses: .
        with:
          project_dir: '.'
        env:
          GITHUB_BASE_REF: ''

      - name: Assert change_html is non-empty (table added)
        env:
          ACTUAL: ${{ steps.action.outputs.change_html }}
        run: |
          echo "actual: $ACTUAL"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected non-empty change_html but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: change_html is non-empty as expected"

      - name: Assert change_html contains table reference
        env:
          ACTUAL: ${{ steps.action.outputs.change_html }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -qi "users"; then
            echo "PASS: change_html mentions 'users' table"
          else
            echo "FAIL: expected 'users' in change_html"
            exit 1
          fi
