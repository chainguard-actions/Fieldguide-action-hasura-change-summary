name: Test with hasura_endpoint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          project_dir: '.'
          hasura_endpoint: 'https://example.hasura.app'
        continue-on-error: true
      - name: Assert action ran with hasura_endpoint and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHANGE_HTML: ${{ steps.action.outputs.change_html }}
        run: |
          echo "outcome: $OUTCOME"
          echo "change_html: $CHANGE_HTML"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion with hasura_endpoint set"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
