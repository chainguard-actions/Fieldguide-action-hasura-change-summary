name: Test basic usage - no changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Hasura metadata (v3, no tables)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/metadata/databases"
          cat > "$GITHUB_WORKSPACE/metadata/version.yaml" <<'EOF'
          version: 3
          EOF
          cat > "$GITHUB_WORKSPACE/metadata/databases/databases.yaml" <<'EOF'
          - name: default
            kind: postgres
            configuration:
              connection_info:
                database_url:
                  from_env: PG_DATABASE_URL
            tables: []
            functions: []
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          project_dir: '.'
        env:
          GITHUB_BASE_REF: 'nonexistent-base-branch-for-fallback'

      - name: Assert change_html output is set (empty or no-change is acceptable)
        env:
          ACTUAL: ${{ steps.action.outputs.change_html }}
        run: |
          echo "actual change_html: '$ACTUAL'"
          # The action should succeed and produce either empty output (no changes)
          # or some HTML. Either way, the step should not have failed.
          echo "PASS: action completed successfully"
