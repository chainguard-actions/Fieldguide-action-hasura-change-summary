name: Test default project_dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_BASE_REF: main
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_REF: refs/pull/1/merge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create metadata directory in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/metadata/databases"
          cat > "$GITHUB_WORKSPACE/metadata/version.yaml" << 'EOF'
          version: 3
          EOF
          cat > "$GITHUB_WORKSPACE/metadata/databases/databases.yaml" << 'EOF'
          - name: default
            configuration:
              connection_info:
                database_url:
                  from_env: HASURA_GRAPHQL_DATABASE_URL
            tables: []
          EOF

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran with default project_dir
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHANGE_HTML: ${{ steps.action.outputs.change_html }}
        run: |
          echo "outcome: $OUTCOME"
          echo "change_html: $CHANGE_HTML"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
