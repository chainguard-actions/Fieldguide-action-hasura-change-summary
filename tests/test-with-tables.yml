name: Test with tables in new metadata
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          project_dir: tests/fixtures/hasura-v3-with-tables

      - name: Assert change_html is non-empty (tables added)
        env:
          ACTUAL: ${{ steps.action.outputs.change_html }}
        run: |
          echo "actual: $ACTUAL"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a change summary but got empty/no-change: $ACTUAL"
            exit 1
          fi
          echo "PASS: change_html is non-empty"

      - name: Assert change_html contains users table reference
        env:
          ACTUAL: ${{ steps.action.outputs.change_html }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -qi "users"; then
            echo "PASS: change_html references users table"
          else
            echo "FAIL: expected change_html to reference 'users' table"
            exit 1
          fi
