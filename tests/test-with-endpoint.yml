name: Test with hasura_endpoint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          project_dir: tests/fixtures/hasura-v3-with-tables
          hasura_endpoint: https://hasura.example.com

      - name: Assert change_html is non-empty (tables added)
        env:
          ACTUAL: ${{ steps.action.outputs.change_html }}
        run: |
          echo "actual: $ACTUAL"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a change summary but got empty/no-change: $ACTUAL"
            exit 1
          fi
          echo "PASS: change_html is non-empty"

      - name: Assert change_html contains hasura endpoint link
        env:
          ACTUAL: ${{ steps.action.outputs.change_html }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "hasura.example.com"; then
            echo "PASS: change_html contains hasura endpoint URL"
          else
            echo "FAIL: expected change_html to contain 'hasura.example.com'"
            exit 1
          fi
