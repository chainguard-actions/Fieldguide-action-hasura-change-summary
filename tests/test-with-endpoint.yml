name: Test with hasura_endpoint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Hasura metadata in custom project directory (v3, no tables)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hasura/metadata/databases"
          cat > "$GITHUB_WORKSPACE/hasura/metadata/version.yaml" <<'EOF'
          version: 3
          EOF
          cat > "$GITHUB_WORKSPACE/hasura/metadata/databases/databases.yaml" <<'EOF'
          - name: default
            kind: postgres
            configuration:
              connection_info:
                database_url:
                  from_env: PG_DATABASE_URL
            tables: []
            functions: []
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          project_dir: 'hasura'
          hasura_endpoint: 'https://example.hasura.app'
        env:
          GITHUB_BASE_REF: 'nonexistent-base-branch-for-fallback'

      - name: Assert action completed and change_html output is accessible
        env:
          ACTUAL: ${{ steps.action.outputs.change_html }}
        run: |
          echo "actual change_html: '$ACTUAL'"
          # The action should succeed. With no changes between empty base and
          # empty new metadata, change_html should be empty or a no-change message.
          echo "PASS: action completed successfully with hasura_endpoint"
